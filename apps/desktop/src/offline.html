<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Stay</title>
<style>
  :root { --canvas: #FAF8F5; --ink: #212422; --ink-2: #626B66; --accent: #006A67; --accent-soft: #E4F0EF; --line: #E9E6DF; }
  @media (prefers-color-scheme: dark) { :root { --canvas: #161817; --ink: #ECEAE4; --ink-2: #A5ABA6; --accent: #4FB3AE; --accent-soft: #1E2D2C; --line: #2A2E2C; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--canvas); color: var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', sans-serif; letter-spacing: -0.011em; }
  main { max-width: 26rem; padding: 2rem; text-align: center; }
  .orb { width: 88px; height: 88px; margin: 0 auto 1.5rem; border-radius: 50%;
         background: radial-gradient(circle at 50% 35%, #0E9F9A 0 1.6px, transparent 2px) 0 0 / 9px 9px, linear-gradient(#0E9F9A, #2F5BD8); opacity: .55;
         -webkit-mask: radial-gradient(circle, #000 60%, transparent 62%); }
  h1 { font-size: 1.35rem; margin: 0 0 .5rem; font-weight: 600; }
  p { color: var(--ink-2); line-height: 1.6; margin: 0 0 1.5rem; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: .75rem 1.4rem; cursor: pointer; background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { button { color: #0b1110; } }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  small { display: block; margin-top: 1.25rem; color: var(--ink-2); }
</style>
</head>
<body>
<main>
  <div class="orb" aria-hidden="true"></div>
  <h1>Stay can't reach the internet</h1>
  <p>Your tasks, memory and reminders are stored on this computer and are safe. Voice and planning need a connection.</p>
  <button id="retry" type="button">Try again</button>
  <small id="why"></small>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const target = q.get('u');
  document.getElementById('why').textContent = q.get('e') || '';
  const go = () => { if (target) location.href = target; };
  document.getElementById('retry').addEventListener('click', go);
  window.addEventListener('online', go);
</script>
</body>
</html>
