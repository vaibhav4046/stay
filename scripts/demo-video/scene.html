<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pix and Stay: the pixel side of the demo</title>
<style>
  html, body { margin: 0; background: #070b11; overflow: hidden; }
  #wrap { position: relative; width: 640px; height: 720px; }
  canvas { position: absolute; left: 0; top: 0; width: 640px; height: 720px; image-rendering: pixelated; }
  #bubbles { position: absolute; inset: 0; font-family: 'Courier New', ui-monospace, monospace; color: #0b0b0f; pointer-events: none; }
  .bubble { position: absolute; max-width: 300px; padding: 10px 12px; font-size: 17px; line-height: 1.25; font-weight: 700; background: #f4f4f4; border: 4px solid #0b0b0f; box-shadow: 4px 4px 0 #0b0b0f; opacity: 0; transition: opacity 120ms steps(2); }
  .bubble.on { opacity: 1; }
  #pix { left: 32px; top: 36px; }
  #stay { right: 24px; top: 300px; background: #8fd3ff; max-width: 270px; }
  #title { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: grid; place-items: center; text-align: center; font-family: 'Courier New', ui-monospace, monospace; font-weight: 800; color: #f4f4f4; font-size: 30px; line-height: 1.3; background: rgba(7,11,17,0.78); opacity: 0; transition: opacity 200ms steps(3); padding: 0 40px; }
  #title.on { opacity: 1; }
  #title small { display: block; margin-top: 14px; font-size: 16px; font-weight: 600; color: #8fd3ff; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="160" height="180"></canvas>
  <div id="bubbles"><div id="pix" class="bubble"></div><div id="stay" class="bubble"></div></div>
  <div id="title"><div id="titleText"></div></div>
</div>
<script>
// Pix is original pixel art made for this demo: a person who keeps putting things off, using Stay.
// The scene is driven by a timeline (window.__SCENE = { cues: [{ t, end, who, kind, text }], titles: [{ t, end, text, sub }] }),
// where t is seconds since the recording started and the cues are the real lines of the recorded call.
const C = { hair: '#0b0b0f', skin: '#f2c9a0', skinD: '#d9a97c', white: '#f4f4f4', stripe: '#151519', jeans: '#3f72a8', jeansD: '#2d5584', shoe: '#b8483a', wall: '#111a28', wall2: '#0e1522', floor: '#0b111b', desk: '#7a5539', deskTop: '#966a46', win: '#0a1c38', star: '#cfe9ff', lap: '#cdd6e0', screen: '#0a1018', ice: '#8fd3ff', iceD: '#3e8fd6', mug: '#e4f6ff' };
const cv = document.getElementById('c'); const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
const px = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
const scene = window.__SCENE || { cues: [], titles: [] };
const T0 = performance.now();
const now = () => (performance.now() - T0) / 1000;

function room(t) {
  px(0, 0, 160, 180, C.wall);
  for (let y = 0; y < 180; y += 6) px(0, y, 160, 1, C.wall2);
  px(0, 140, 160, 40, C.floor);
  // window with stars
  px(100, 14, 48, 56, '#1c2a40'); px(103, 17, 42, 50, C.win); px(123, 17, 2, 50, '#1c2a40'); px(103, 41, 42, 2, '#1c2a40');
  [[108, 24], [132, 22], [138, 52], [110, 56], [118, 32], [140, 34]].forEach(([x, y], i) => { if (((t * 2 + i) % 3) > 0.4) px(x, y, 1, 1, C.star); });
  // poster of a dotted circle (Stay's mark)
  for (let a = 0; a < 40; a++) { const r = 9; px(24 + 10 + Math.cos(a / 40 * 6.283) * r, 30 + 10 + Math.sin(a / 40 * 6.283) * r, 1, 1, C.iceD); }
}

function desk(t, glow, screenKind) {
  px(14, 112, 132, 5, C.deskTop); px(14, 117, 132, 3, C.desk); px(20, 120, 5, 34, C.desk); px(135, 120, 5, 34, C.desk);
  // laptop, seen from the front (back of the lid faces us: Pix looks at the screen)
  px(60, 100, 40, 12, C.lap); px(58, 112, 44, 2, '#aeb8c4');
  px(78, 104, 4, 4, glow ? C.ice : '#8a94a0'); // the lid logo glows when Stay is awake
  // mug
  px(118, 104, 8, 8, C.mug); px(126, 106, 2, 4, C.mug);
  if (Math.floor(t * 2) % 2 === 0) { px(120, 100, 1, 3, '#cfd8e3'); px(123, 98, 1, 3, '#cfd8e3'); }
}

function pix(t, st) {
  const bob = st.talking ? (Math.floor(t * 6) % 2) : (Math.floor(t * 1.5) % 2 === 0 ? 0 : 0);
  const x = 62, y = 52 + bob; // head top-left
  // torso (striped shirt)
  for (let r = 0; r < 20; r++) px(x - 3, y + 30 + r, 26, 1, Math.floor(r / 2) % 2 === 0 ? C.stripe : C.white);
  px(x - 3, y + 28, 26, 2, C.white);
  // neck
  px(x + 7, y + 25, 6, 4, C.skinD);
  // head
  px(x + 1, y + 6, 18, 20, C.skin);
  // hair: messy black
  px(x - 1, y + 1, 22, 8, C.hair); px(x - 2, y + 5, 4, 9, C.hair); px(x + 18, y + 5, 4, 8, C.hair);
  px(x + 3, y - 2, 5, 4, C.hair); px(x + 11, y - 3, 6, 5, C.hair); px(x + 17, y - 1, 4, 3, C.hair); px(x + 8, y + 9, 8, 2, C.hair);
  // eyes (look at the laptop or at the viewer)
  const look = st.listening ? 1 : st.show ? -1 : 0;
  const blink = Math.floor(t * 10) % 37 === 0;
  [x + 5, x + 12].forEach((ex) => {
    px(ex, y + 14, 4, blink ? 1 : 4, C.white);
    if (!blink) px(ex + 1 + look, y + 15, 2, 3, C.hair);
  });
  px(x + 5, y + 12, 4, 1, C.hair); px(x + 12, y + 12, 4, 1, C.hair); // brows
  if (st.worried) { px(x + 5, y + 11, 3, 1, C.hair); px(x + 13, y + 11, 3, 1, C.hair); }
  // mouth
  const my = y + 21;
  if (st.talking) { const o = Math.floor(t * 9) % 3; px(x + 8, my, 4, 1 + o, '#7a2a2a'); }
  else if (st.happy) { px(x + 7, my, 6, 1, '#7a2a2a'); px(x + 6, my - 1, 1, 1, '#7a2a2a'); px(x + 13, my - 1, 1, 1, '#7a2a2a'); }
  else px(x + 8, my, 4, 1, '#7a2a2a');
  // arms
  if (st.typing) {
    const a = Math.floor(t * 8) % 2;
    px(x - 8, y + 34, 6, 5, C.white); px(x - 10, y + 39 + a, 8, 4, C.skin); px(x + 22, y + 34, 6, 5, C.white); px(x + 24, y + 39 + (1 - a), 8, 4, C.skin);
  } else if (st.show) {
    px(x + 22, y + 32, 6, 5, C.white); px(x + 26, y + 20, 5, 14, C.white); px(x + 26, y + 16, 6, 5, C.skin); px(x - 8, y + 34, 6, 12, C.white); px(x - 8, y + 44, 6, 4, C.skin);
  } else if (st.thinking) {
    px(x - 8, y + 34, 6, 12, C.white); px(x - 8, y + 44, 6, 4, C.skin);
    px(x + 22, y + 30, 6, 5, C.white); px(x + 20, y + 20, 5, 12, C.white); px(x + 17, y + 17, 5, 5, C.skin);
  } else {
    px(x - 8, y + 34, 6, 14, C.white); px(x - 8, y + 47, 6, 4, C.skin); px(x + 22, y + 34, 6, 14, C.white); px(x + 22, y + 47, 6, 4, C.skin);
  }
}

function sound(t, on, who) {
  if (!on) return;
  const ring = Math.floor(t * 5) % 4;
  const cx = who === 'pix' ? 54 : 100, cy = who === 'pix' ? 76 : 100;
  for (let i = 0; i <= ring; i++) { const r = 4 + i * 3; for (let a = 0; a < 8; a++) { const ang = (who === 'pix' ? 3.14 : 0) + (a - 3.5) * 0.18; px(cx + Math.cos(ang) * r * (who === 'pix' ? 1 : 1), cy + Math.sin(ang) * r, 1, 1, who === 'pix' ? '#f4f4f4' : C.ice); }}
}

function laptopScreen(t, kind) {
  // a small view of what is on the laptop, in the corner (the screen faces Pix; this is the "what Stay sees" inset)
  if (kind === 'email') {
    px(6, 150, 62, 26, '#ffffff'); px(6, 150, 62, 3, '#cfd8e3');
    px(9, 156, 34, 2, '#111'); px(9, 160, 40, 2, '#111'); px(9, 164, 24, 2, '#9aa5b1'); px(9, 169, 14, 4, '#2563eb');
    if (Math.floor(t * 3) % 2 === 0) px(34, 164, 1, 2, '#111');
  } else if (kind === 'orb') {
    px(6, 150, 62, 26, '#05080c');
    for (let a = 0; a < 60; a++) { const r = 8 + Math.sin(t * 3 + a) * 1.5; px(37 + Math.cos(a / 60 * 6.283) * r, 163 + Math.sin(a / 60 * 6.283) * r, 1, 1, a % 3 ? C.ice : C.iceD); }
  } else if (kind === 'panel') {
    px(6, 150, 62, 26, '#0f1620'); px(9, 153, 56, 5, C.iceD); px(9, 160, 56, 4, '#1a2433'); px(9, 166, 40, 4, '#1a2433'); px(9, 172, 48, 2, '#1a2433');
  }
}

function frame() {
  const t = now();
  const cue = scene.cues.find((c) => t >= c.t && t < c.end);
  const cuesNow = scene.cues.filter((c) => t >= c.t && t < c.end);
  const pixSays = cuesNow.find((c) => c.who === 'person' && !c.typed);
  const staySays = cuesNow.find((c) => c.who === 'stay');
  const typed = cuesNow.find((c) => c.typed);
  const shownEmail = scene.cues.some((c) => c.kind === 'screen' && t >= c.t - 2 && t < c.end + 3);
  const st = {
    talking: !!pixSays, listening: !!staySays, typing: !!typed || (!!cue && cue.kind === 'type'),
    show: shownEmail, thinking: !pixSays && !staySays && !typed && t > 3 && t < 18,
    worried: t < 18 && !pixSays, happy: t > (scene.happyAt || 1e9),
  };
  room(t); desk(t, st.listening || !!pixSays, null); pix(t, st);
  sound(t, !!pixSays, 'pix'); sound(t, !!staySays, 'stay');
  laptopScreen(t, shownEmail ? 'email' : typed ? 'panel' : 'orb');
  if (st.happy) for (let i = 0; i < 6; i++) px(46 + ((i * 17 + Math.floor(t * 12)) % 50), 44 + ((i * 11) % 18), 1, 1, '#ffe28a');

  const pb = document.getElementById('pix'); const sb = document.getElementById('stay');
  const say = pixSays || typed;
  pb.textContent = say ? (typed ? '⌨ ' : '') + say.text : ''; pb.classList.toggle('on', !!say);
  sb.textContent = staySays ? staySays.text : ''; sb.classList.toggle('on', !!staySays);
  const ti = (scene.titles || []).find((x) => t >= x.t && t < x.end);
  const tt = document.getElementById('title');
  document.getElementById('titleText').innerHTML = ti ? ti.text + (ti.sub ? '<small>' + ti.sub + '</small>' : '') : '';
  tt.classList.toggle('on', !!ti);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
