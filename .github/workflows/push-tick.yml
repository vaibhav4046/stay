name: Stay check-ins

# Wakes the server once an hour so it can send whichever calm check-ins are due (see src/lib/push/schedule.ts).
# Each send window is two hours wide, so it holds at least two ticks: a late or failed run is retried the next hour, inside the same window.
# Hourly on purpose: every run lists the Blob store (one "advanced operation"), and the free plan allows 2,000 a month and then locks the
# store for 30 days. Every 15 minutes would be 2,880 a month; hourly is about 720, which leaves room for subscriptions and sends.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send due check-ins
        env:
          PUSH_TICK_SECRET: ${{ secrets.PUSH_TICK_SECRET }}
        run: |
          test -n "$PUSH_TICK_SECRET" || { echo "PUSH_TICK_SECRET is not set"; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 90 --retry 3 --retry-delay 20 --retry-all-errors -X POST \
            -H "Authorization: Bearer $PUSH_TICK_SECRET" \
            https://stay-two-swart.vercel.app/api/push/tick
