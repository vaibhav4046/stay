<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F5">
<title>Stay: offline</title>
<style>
  :root { --canvas: #FAF8F5; --ink: #212422; --ink-2: #626B66; --accent: #006A67; }
  @media (prefers-color-scheme: dark) { :root { --canvas: #161817; --ink: #ECEAE4; --ink-2: #A5ABA6; --accent: #4FB3AE; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--canvas); color: var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'DM Sans', 'Segoe UI', sans-serif; letter-spacing: -0.011em; padding: 1.5rem; }
  main { max-width: 26rem; text-align: center; }
  h1 { font-size: 1.35rem; margin: 0 0 .5rem; font-weight: 600; }
  p { color: var(--ink-2); line-height: 1.6; margin: 0 0 1.5rem; }
  a { display: inline-block; font-weight: 600; text-decoration: none; border-radius: 12px; padding: .75rem 1.4rem; background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { a { color: #0b1110; } }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>No connection right now</h1>
  <p>Your tasks, memory and reminders are stored on this device and are safe. Talking to Stay and planning need the internet.</p>
  <a href="/app/today">Try again</a>
</main>
<script>addEventListener('online', function () { location.href = '/app/today'; });</script>
</body>
</html>
